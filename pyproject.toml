[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hosig-align"
version = "0.1.0"
description = "Independent, auditable reproduction of HoSig-Align I"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "networkx>=3.4,<4",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hosig-align = "hosig.cli:main"

[tool.setuptools.packages.find]
include = ["hosig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
